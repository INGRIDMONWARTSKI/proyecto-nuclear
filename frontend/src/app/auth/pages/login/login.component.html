<section class="login card">
  <h1>Iniciar sesión</h1>
  <p class="login__subtitle">Simulador de Psicología Social</p>

  @if (errorMessage()) {
    <app-alert-message [message]="errorMessage()!" />
  }

  @if (loading()) {
    <app-loading-state message="Iniciando sesión..." />
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-field">
        <label for="email">Correo</label>
        <input id="email" type="email" formControlName="email" autocomplete="username" />
      </div>
      <div class="form-field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary btn--big" type="submit" [disabled]="form.invalid">
        Entrar
      </button>
    </form>

    <div class="login__hints">
      <p><strong>Cuentas de prueba</strong></p>
      <p>Admin: admin&#64;nuclear.local</p>
      <p>Profesor: profesor&#64;nuclear.local</p>
      <p>Estudiante: estudiante1&#64;nuclear.local</p>
      <p class="login__pass">Contraseña: Admin123* / Profesor123* / Estudiante123*</p>
    </div>
  }
</section>
