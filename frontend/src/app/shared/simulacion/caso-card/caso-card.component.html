<article class="card caso-card">
  <h3>{{ caso.titulo }}</h3>
  <p class="caso-card__desc">{{ caso.descripcion || 'Sin descripción.' }}</p>
  <p class="caso-card__goal">
    <strong>Objetivo:</strong> {{ caso.objetivoAprendizaje || 'No definido' }}
  </p>
  <div class="caso-card__meta">
    <span class="badge badge-active">{{ caso.totalEscenarios }} escenarios</span>
  </div>
  <button class="btn btn-primary" type="button" (click)="onStart()" [disabled]="starting">
    {{ starting ? 'Iniciando...' : 'Iniciar simulación' }}
  </button>
</article>
